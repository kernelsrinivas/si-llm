name: native si

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/si-native.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: si-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: si-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: si-macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            name: si-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --manifest-path native/si/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: native/si/target/${{ matrix.target }}/release/si*
